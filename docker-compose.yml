services:
  postgres:
    image: postgres:16-alpine
    container_name: khmermeet-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khmermeet_ai
    ports:
      - "5432:5432"
    volumes:
      - khmermeet_postgres_data:/var/lib/postgresql/data

volumes:
  khmermeet_postgres_data:
